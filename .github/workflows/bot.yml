name: Telepost Bot 24/7

on:
  schedule:
    # Safety-net: GitHub throttles free-account schedules to 1-3h. The real
    # continuity comes from the re-dispatch step at the end of this workflow.
    - cron: '41 5,11,17,23 * * *'
  push:
    branches: [main]
    # Ignore DB backups & keep-alive commits: a push-triggered run would kill
    # the live bot (cancel-in-progress) and cause a restart loop.
    paths-ignore:
      - 'data/**'
      - '.github/keep-alive.txt'
  workflow_dispatch:

concurrency:
  group: telepost-single
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub-hosted runner jobs are killed at 6h (360 min)
    steps:
      - uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      # Persist the SQLite DB across runs — without this every restart began
      # with an empty database (actions/cache restore, freshest by run_id).
      - name: Restore database
        uses: actions/cache@v4
        with:
          path: data/telepost.db
          key: telepost-db-${{ github.run_id }}
          restore-keys: |
            telepost-db-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DB_PATH: data/telepost.db
          LOG_LEVEL: INFO
        run: |
          set +e
          python -m bot.main &
          echo "Bot PID: $!"
          # Keep alive: restart the bot whenever its process dies
          while true; do
            sleep 60
            if ! pgrep -f "python -m bot.main" > /dev/null 2>&1; then
              echo "Bot process died at $(date -u '+%H:%M:%SZ'), restarting..."
              python -m bot.main &
              echo "Restarted with PID: $!"
            fi
          done

      # Save the DB even when the job is cancelled/times out so the next run
      # can restore it (unique key per run avoids cache already-exists errors).
      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/telepost.db
          key: telepost-db-${{ github.run_id }}

      # Git backup of the DB — insurance against actions/cache eviction
      # (7 days of repo inactivity). Push failures are non-fatal.
      - name: Save database to git
        if: always()
        run: |
          if [ -f data/telepost.db ]; then
            git config user.name "Telepost Bot"
            git config user.email "telepost-bot@users.noreply.github.com"
            # Backup the live DB BEFORE switching branch (checkout would overwrite
            # it with the stale version from origin/main)
            cp data/telepost.db /tmp/telepost-live.db
            git fetch origin main || true
            git checkout -B db-update origin/main || true
            mkdir -p data && cp /tmp/telepost-live.db data/telepost.db
            git add -f data/telepost.db || true
            git diff --staged --quiet || git commit -m "db: update $(date +%Y-%m-%d_%H:%M)" || true
            git push origin db-update:main 2>&1 || echo "DB push skipped (newer commits — OK, cached via actions/cache)"
          fi

      # Re-dispatch: continuous 24/7 chain without relying on throttled cron.
      - name: Re-dispatch workflow for 24/7
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=${{ github.repository }}
          sleep 10
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" -d '{"ref":"main"}')
            if [ "$HTTP_CODE" = "204" ]; then echo "✅ Re-dispatched (attempt $i)"; break; fi
            echo "❌ Attempt $i failed (HTTP $HTTP_CODE), retrying..."; sleep 15
          done
