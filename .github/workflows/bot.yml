name: Telepost Bot 24/7

on:
  schedule:
    # Restart twice a day as a safety net (the run itself lasts up to 14 days).
    - cron: '41 5,17 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: telepost-single
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20160  # 14 days max
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DB_PATH: data/telepost.db
          LOG_LEVEL: INFO
        run: |
          set +e
          python -m bot.main &
          echo "Bot PID: $!"
          # Keep alive: restart the bot whenever its process dies
          while true; do
            sleep 60
            if ! pgrep -f "python -m bot.main" > /dev/null 2>&1; then
              echo "Bot process died at $(date -u '+%H:%M:%SZ'), restarting..."
              python -m bot.main &
              echo "Restarted with PID: $!"
            fi
          done
